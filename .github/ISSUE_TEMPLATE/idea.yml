name: 💡 Una idea / An idea
description: Algo que te gustaría que Graba hiciera. / Something you'd like Graba to do.
labels: [idea]
body:
  - type: textarea
    id: problema
    attributes:
      label: ¿Qué te gustaría poder hacer? / What would you like to do?
      description: Cuéntalo desde lo que grabas, no desde la solución. Ej: "después de grabar un tutorial quiero…"
    validations: { required: true }
  - type: textarea
    id: como
    attributes:
      label: ¿Cómo te lo imaginas? (opcional) / How do you picture it? (optional)
  - type: checkboxes
    id: ayudar
    attributes:
      label: ¿Te animas a ayudar? / Want to help?
      options:
        - label: Me gustaría programarlo (con o sin IA) / I'd like to build it (with or without AI)
        - label: Puedo probarlo cuando esté / I can test it when it's ready
