<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'">
<title>Graba · teleprompter</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; font: 15px system-ui, "Segoe UI", Ubuntu, sans-serif; color: #fff; }
  .panel { box-sizing: border-box; height: 100%; border-radius: 16px; background: rgba(18, 17, 22, .93); display: flex; flex-direction: column; overflow: hidden; }
  .barra { display: flex; align-items: center; gap: 8px; padding: 8px 12px; -webkit-app-region: drag; background: rgba(255, 255, 255, .04); }
  .barra button, .barra input { -webkit-app-region: no-drag; }
  button { border: 0; background: rgba(255, 255, 255, .1); color: #fff; border-radius: 8px; min-width: 30px; height: 28px; cursor: pointer; font: inherit; }
  button:focus-visible, input:focus-visible { outline: 2px solid #b9b0ff; outline-offset: 2px; }
  input[type=range] { width: 110px; accent-color: #8f82ff; }
  .suave { opacity: .6; font-size: 13px; }
  .espacio { flex: 1; }
  .vista { position: relative; flex: 1; overflow: hidden; }
  .texto { position: absolute; left: 20px; right: 20px; top: 0; white-space: pre-wrap; line-height: 1.35; font-weight: 600; will-change: transform; }
  textarea { position: absolute; inset: 0; box-sizing: border-box; width: 100%; height: 100%; padding: 14px 20px; border: 0; resize: none; outline: none;
    background: transparent; color: #fff; font: 600 18px system-ui, "Segoe UI", Ubuntu, sans-serif; line-height: 1.35; }
  textarea::placeholder { color: rgba(255, 255, 255, .45); }
  [hidden] { display: none !important; }
  .linea { position: absolute; left: 0; right: 0; top: 70px; height: 2px; background: rgba(110, 92, 252, .5); pointer-events: none; }
</style>
</head>
<body>
<!-- Teleprompter: solo lo ve la persona. En Windows queda fuera del video (setContentProtection); en Linux sale (no hay cómo excluirlo). -->
<div class="panel">
  <div class="barra">
    <button id="pausa" aria-label="">⏸</button>
    <button id="inicio" aria-label="">⏮</button>
    <span class="suave" aria-hidden="true">🐢</span><input id="velocidad" type="range" min="5" max="120" step="1"><span class="suave" aria-hidden="true">🐇</span>
    <span class="espacio"></span>
    <button id="editar" aria-label="">✎</button>
    <button id="menos" aria-label="">A−</button>
    <button id="mas" aria-label="">A+</button>
  </div>
  <div class="vista" id="vista"><div class="texto" id="texto"></div><div class="linea" id="linea"></div><textarea id="edicion" hidden></textarea></div>
</div>
<script src="teleprompter.js"></script>
</body>
</html>
