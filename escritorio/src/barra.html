<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'">
<title>Graba · barra</title>
<style>
  html, body { margin: 0; background: transparent; overflow: hidden; font: 600 13px system-ui, "Segoe UI", Ubuntu, sans-serif; user-select: none; }
  .barra { display: inline-flex; align-items: center; gap: 4px; padding: 6px; border-radius: 999px; background: rgba(28, 28, 30, .96);
    border: 1px solid rgba(255, 255, 255, .08); color: #fff; -webkit-app-region: drag; white-space: nowrap; }
  button { -webkit-app-region: no-drag; border: 0; background: transparent; color: rgba(255, 255, 255, .5); height: 32px; min-width: 34px;
    border-radius: 8px; cursor: pointer; font: inherit; display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 0 8px; }
  button:hover { background: rgba(255, 255, 255, .08); }
  button.activo { color: #fff; background: rgba(255, 255, 255, .14); }
  button:focus-visible { outline: 2px solid #b9b0ff; outline-offset: 1px; }
  svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .sep { width: 1px; height: 20px; background: rgba(255, 255, 255, .12); margin: 0 4px; }
  .detalle { color: rgba(255, 255, 255, .75); font-weight: 500; font-size: 12px; max-width: 150px; overflow: hidden; text-overflow: ellipsis; padding: 0 6px; }
  .rojo { background: #d6363b; color: #fff; border-radius: 999px; padding: 0 14px; }
  .rojo:hover { background: #e04045; }
  .rojo:disabled { background: rgba(255, 255, 255, .12); color: rgba(255, 255, 255, .5); cursor: default; }
  .punto { width: 9px; height: 9px; border-radius: 50%; background: currentColor; display: inline-block; }
  .punto.rec { background: #e8402f; margin-left: 10px; }
  .reloj { font-variant-numeric: tabular-nums; font-weight: 500; min-width: 46px; padding: 0 4px; }
  .cuenta { color: rgba(255, 255, 255, .85); font-weight: 500; padding: 0 12px; }
  .cerrar { color: rgba(255, 255, 255, .55); min-width: 30px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<!-- Barra de grabación (como la de Mac): preparar → cuenta → grabando. En Windows no sale en el video (setContentProtection). -->
<div class="barra" id="barra">
  <span id="preparando">
    <button id="grabaciones" data-accion="grabaciones"><svg viewBox="0 0 24 24"><rect x="4" y="9" width="16" height="11" rx="2"/><path d="M6 6h12M8 3h8"/></svg></button>
    <span class="sep"></span>
    <button id="pantalla" data-accion="pantalla"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg></button>
    <button id="ventana" data-accion="ventana"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 9h18M6.5 7h.01M9 7h.01"/></svg></button>
    <button id="area" data-accion="area"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="1.5" stroke-dasharray="3 2.6"/></svg></button>
    <span class="detalle" id="detalle" hidden></span>
    <span class="sep"></span>
    <button id="camara" data-accion="camara"><svg viewBox="0 0 24 24"><rect x="3" y="7" width="13" height="10" rx="2"/><path d="m16 11 5-3v8l-5-3z"/></svg></button>
    <button id="microfono" data-accion="microfono"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
    <button id="guion" data-accion="guion"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 10h12M4 14h16M4 18h9"/></svg></button>
    <span class="sep"></span>
    <button class="rojo" id="grabar" data-accion="grabar"><span class="punto"></span><span id="t-grabar"></span></button>
  </span>
  <span class="cuenta" id="cuenta" hidden></span>
  <span id="grabando" hidden>
    <span class="punto rec"></span><span class="reloj" id="reloj">00:00</span>
    <button class="rojo" id="terminar" data-accion="terminar"><svg viewBox="0 0 24 24" style="width:11px;height:11px;fill:#fff;stroke:none"><rect x="4" y="4" width="16" height="16" rx="3"/></svg><span id="t-terminar"></span></button>
  </span>
  <button class="cerrar" id="cerrar" data-accion="cerrar"><svg viewBox="0 0 24 24" style="width:12px;height:12px;stroke-width:3"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
</div>
<script src="barra.js"></script>
</body>
</html>
